<svg width="1000" height="460" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="460" fill="#FFFFFF"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Three ways to roll out a new version</text>

  <!-- Rolling -->
  <text x="170" y="90" font-size="14" font-weight="bold" fill="#4285F4" text-anchor="middle">Rolling Update</text>
  <rect x="60" y="110" width="60" height="50" rx="8" fill="#4285F4"/>
  <rect x="130" y="110" width="60" height="50" rx="8" fill="#4285F4"/>
  <rect x="200" y="110" width="60" height="50" rx="8" fill="#F4F6FB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="90" y="140" font-size="10" fill="#FFF" text-anchor="middle">v2</text>
  <text x="160" y="140" font-size="10" fill="#FFF" text-anchor="middle">v2</text>
  <text x="230" y="140" font-size="10" fill="#374151" text-anchor="middle">v1</text>
  <text x="170" y="190" font-size="11" fill="#6B7280" text-anchor="middle">instances swapped</text>
  <text x="170" y="205" font-size="11" fill="#6B7280" text-anchor="middle">gradually, one by one</text>

  <!-- Blue-Green -->
  <text x="500" y="90" font-size="14" font-weight="bold" fill="#00A896" text-anchor="middle">Blue/Green</text>
  <rect x="400" y="110" width="90" height="50" rx="8" fill="#94A3E8"/>
  <text x="445" y="140" font-size="11" fill="#16224F" text-anchor="middle" font-weight="bold">Blue (v1)</text>
  <rect x="510" y="110" width="90" height="50" rx="8" fill="#00A896"/>
  <text x="555" y="140" font-size="11" fill="#FFF" text-anchor="middle" font-weight="bold">Green (v2)</text>
  <line x1="555" y1="165" x2="555" y2="180" stroke="#00A896" stroke-width="2"/>
  <text x="500" y="195" font-size="11" fill="#6B7280" text-anchor="middle">traffic flips 100% at once,</text>
  <text x="500" y="210" font-size="11" fill="#6B7280" text-anchor="middle">old version stays on standby</text>

  <!-- Canary -->
  <text x="830" y="90" font-size="14" font-weight="bold" fill="#F96167" text-anchor="middle">Canary</text>
  <rect x="740" y="110" width="180" height="50" rx="8" fill="#F4F6FB" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="740" y="110" width="18" height="50" rx="8" fill="#F96167"/>
  <text x="830" y="140" font-size="10" fill="#374151" text-anchor="middle">95% v1 · 5% v2</text>
  <text x="830" y="195" font-size="11" fill="#6B7280" text-anchor="middle">v2 gets a small slice of</text>
  <text x="830" y="210" font-size="11" fill="#6B7280" text-anchor="middle">real traffic, watched closely</text>

  <rect x="60" y="260" width="880" height="150" rx="12" fill="#F4F6FB" stroke="#DDE3EF" stroke-width="1.5"/>
  <text x="90" y="295" font-size="13" font-weight="bold" fill="#16224F">Rolling:</text>
  <text x="170" y="295" font-size="12" fill="#374151">simple, default in many systems — but a bad version affects live users during rollout.</text>
  <text x="90" y="330" font-size="13" font-weight="bold" fill="#16224F">Blue/Green:</text>
  <text x="190" y="330" font-size="12" fill="#374151">instant rollback (just flip back) — but needs double the infrastructure running briefly.</text>
  <text x="90" y="365" font-size="13" font-weight="bold" fill="#16224F">Canary:</text>
  <text x="170" y="365" font-size="12" fill="#374151">safest for catching bad releases early — but slowest, and needs real monitoring to work.</text>
</svg>
