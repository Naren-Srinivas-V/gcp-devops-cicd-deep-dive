<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#FFFFFF"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">CI/CD identity — the highest-stakes service account you'll create</text>

  <!-- Overprivileged -->
  <text x="230" y="90" font-size="15" font-weight="bold" fill="#F96167" text-anchor="middle">BAD: Overprivileged build SA</text>
  <rect x="150" y="120" width="160" height="60" rx="10" fill="#F96167"/>
  <text x="230" y="155" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Build SA (Editor)</text>
  <g stroke="#F96167" stroke-width="1.5">
    <line x1="230" y1="180" x2="80" y2="260"/>
    <line x1="230" y1="180" x2="180" y2="260"/>
    <line x1="230" y1="180" x2="280" y2="260"/>
    <line x1="230" y1="180" x2="380" y2="260"/>
  </g>
  <rect x="40" y="260" width="80" height="45" rx="7" fill="#FBEAF0" stroke="#F96167"/>
  <text x="80" y="286" font-size="9" fill="#B0293A" text-anchor="middle">Prod DB</text>
  <rect x="140" y="260" width="80" height="45" rx="7" fill="#FBEAF0" stroke="#F96167"/>
  <text x="180" y="286" font-size="9" fill="#B0293A" text-anchor="middle">All buckets</text>
  <rect x="240" y="260" width="80" height="45" rx="7" fill="#FBEAF0" stroke="#F96167"/>
  <text x="280" y="286" font-size="9" fill="#B0293A" text-anchor="middle">IAM policies</text>
  <rect x="340" y="260" width="80" height="45" rx="7" fill="#FBEAF0" stroke="#F96167"/>
  <text x="380" y="286" font-size="9" fill="#B0293A" text-anchor="middle">Networking</text>
  <text x="230" y="340" font-size="11" fill="#B0293A" text-anchor="middle">a compromised build pipeline</text>
  <text x="230" y="355" font-size="11" fill="#B0293A" text-anchor="middle">reaches EVERYTHING</text>

  <line x1="500" y1="80" x2="500" y2="380" stroke="#DDE3EF" stroke-width="2"/>

  <!-- Scoped -->
  <text x="770" y="90" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle">GOOD: Scoped build SA</text>
  <rect x="690" y="120" width="160" height="60" rx="10" fill="#00A896"/>
  <text x="770" y="155" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Build SA (narrow)</text>
  <line x1="770" y1="180" x2="770" y2="260" stroke="#00A896" stroke-width="1.5"/>
  <rect x="680" y="260" width="180" height="45" rx="7" fill="#E1F5EE" stroke="#00A896"/>
  <text x="770" y="286" font-size="10" fill="#00695C" text-anchor="middle">Deploy to ONE Cloud Run service</text>
  <text x="770" y="340" font-size="11" fill="#00695C" text-anchor="middle">a compromised build pipeline</text>
  <text x="770" y="355" font-size="11" fill="#00695C" text-anchor="middle">reaches only what it needs</text>
</svg>
