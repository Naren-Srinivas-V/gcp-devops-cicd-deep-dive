<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#4285F4" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Inside a Cloud Build job — steps run in sequence</text>

  <rect x="60" y="120" width="850" height="60" rx="10" fill="#F4F6FB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="90" y="155" font-size="12" fill="#374151" font-family="Courier New">cloudbuild.yaml</text>

  <rect x="60" y="210" width="190" height="80" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="155" y="245" font-size="12" fill="#1B3A8C" text-anchor="middle" font-weight="bold">Step 1</text>
  <text x="155" y="263" font-size="11" fill="#1B3A8C" text-anchor="middle">run tests</text>

  <rect x="290" y="210" width="190" height="80" rx="12" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="385" y="245" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">Step 2</text>
  <text x="385" y="263" font-size="11" fill="#00695C" text-anchor="middle">docker build</text>

  <rect x="520" y="210" width="190" height="80" rx="12" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="615" y="245" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">Step 3</text>
  <text x="615" y="263" font-size="11" fill="#B0293A" text-anchor="middle">push to registry</text>

  <rect x="750" y="210" width="160" height="80" rx="12" fill="#16224F"/>
  <text x="830" y="245" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Step 4</text>
  <text x="830" y="263" font-size="11" fill="#CADCFC" text-anchor="middle">deploy</text>

  <line x1="250" y1="250" x2="285" y2="250" stroke="#4285F4" stroke-width="2" marker-end="url(#p2)"/>
  <line x1="480" y1="250" x2="515" y2="250" stroke="#4285F4" stroke-width="2" marker-end="url(#p2)"/>
  <line x1="710" y1="250" x2="745" y2="250" stroke="#4285F4" stroke-width="2" marker-end="url(#p2)"/>

  <text x="500" y="350" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    If Step 1 (tests) fails, the pipeline stops right there — nothing broken ever reaches Step 3 or 4.
  </text>
</svg>
