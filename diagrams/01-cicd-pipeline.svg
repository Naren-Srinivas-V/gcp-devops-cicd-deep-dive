<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">A CI/CD pipeline, end to end</text>

  <rect x="20" y="150" width="150" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="95" y="188" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Code push</text>
  <text x="95" y="208" font-size="11" fill="#6B7280" text-anchor="middle">to git</text>

  <rect x="205" y="150" width="150" height="90" rx="14" fill="#4285F4"/>
  <text x="280" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud Build</text>
  <text x="280" y="208" font-size="11" fill="#E8F0FE" text-anchor="middle">build &amp; test</text>

  <rect x="390" y="150" width="150" height="90" rx="14" fill="#16224F"/>
  <text x="465" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Artifact</text>
  <text x="465" y="206" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Registry</text>
  <text x="465" y="222" font-size="10" fill="#CADCFC" text-anchor="middle">image stored</text>

  <rect x="575" y="150" width="150" height="90" rx="14" fill="#00A896"/>
  <text x="650" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Deploy</text>
  <text x="650" y="208" font-size="11" fill="#FFFFFF" text-anchor="middle">to Cloud Run / GKE</text>

  <rect x="760" y="150" width="200" height="90" rx="14" fill="#F96167"/>
  <text x="860" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Live service</text>
  <text x="860" y="208" font-size="11" fill="#FFFFFF" text-anchor="middle">(Chapter 2)</text>

  <line x1="170" y1="195" x2="200" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#p1)"/>
  <line x1="355" y1="195" x2="385" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#p1)"/>
  <line x1="540" y1="195" x2="570" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#p1)"/>
  <line x1="725" y1="195" x2="755" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#p1)"/>

  <text x="500" y="300" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Every step here runs AS a service account — the same least-privilege identity
  </text>
  <text x="500" y="322" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    discipline from Chapters 1 and 2, now automated and unattended.
  </text>
</svg>
