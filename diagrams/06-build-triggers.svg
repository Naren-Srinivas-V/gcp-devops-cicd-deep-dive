<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="p6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Triggers — what actually starts a pipeline</text>

  <rect x="40" y="140" width="180" height="80" rx="12" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="130" y="175" font-size="12" fill="#374151" text-anchor="middle" font-weight="bold">Developer</text>
  <text x="130" y="195" font-size="11" fill="#6B7280" text-anchor="middle">git push</text>

  <rect x="290" y="140" width="180" height="80" rx="12" fill="#4285F4"/>
  <text x="380" y="175" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud Build</text>
  <text x="380" y="195" font-size="11" fill="#E8F0FE" text-anchor="middle">Trigger (watching the repo)</text>

  <rect x="540" y="140" width="180" height="80" rx="12" fill="#00A896"/>
  <text x="630" y="175" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Pipeline runs</text>
  <text x="630" y="195" font-size="11" fill="#FFFFFF" text-anchor="middle">automatically, unattended</text>

  <rect x="790" y="140" width="170" height="80" rx="12" fill="#F96167"/>
  <text x="875" y="175" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Result</text>
  <text x="875" y="195" font-size="11" fill="#FFFFFF" text-anchor="middle">deployed or failed, reported back</text>

  <line x1="220" y1="180" x2="285" y2="180" stroke="#16224F" stroke-width="2.5" marker-end="url(#p6)"/>
  <line x1="470" y1="180" x2="535" y2="180" stroke="#16224F" stroke-width="2.5" marker-end="url(#p6)"/>
  <line x1="720" y1="180" x2="785" y2="180" stroke="#16224F" stroke-width="2.5" marker-end="url(#p6)"/>

  <text x="500" y="280" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    No human clicks "deploy" — the trigger is the entire point of CI/CD: the pipeline
  </text>
  <text x="500" y="302" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    runs the same way, every time, without depending on someone remembering the steps.
  </text>
</svg>
